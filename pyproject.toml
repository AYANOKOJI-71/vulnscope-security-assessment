[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscope-security-assessment"
version = "0.1.0"
description = "Client-authorized OWASP-aligned vulnerability assessment portal"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<46",
  "dnspython>=2.7,<3",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.30,<0.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<8.4", "ruff>=0.8,<0.9"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
